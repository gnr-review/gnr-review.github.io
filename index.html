<section id="abstract" class="sec">
  <div class="wrap">
   <div class="wrap--text">
    <p class="eyebrow">Abstract</p>
    <div class="abstract">
      <p>Human demonstrations are a scalable data source for learning dexterous manipulation, but the embodiment gap prevents human motion from being executed directly on robots. Inverse kinematics (IK) retargets human motion to robots efficiently but ignores dynamics, often producing infeasible motions. Reinforcement learning (RL) and sampling-based model predictive control (MPC) are commonly employed to yield dynamically feasible motions, but both are sample-inefficient and sensitive to hyperparameters. RL suffers from costly and unstable training and tedious reward engineering; MPC avoids policy optimization, yet retargets each trajectory in isolation, and solving one does not make the next easier. Sampling cost grows rapidly with dataset size and task difficulty. We hypothesize that dynamically feasible trajectories concentrate near a low-dimensional manifold shared across demonstrations, so that retargeting can be reduced to sampling from that manifold, conditioned on human motion, rather than solving a fresh optimization problem for every demonstration. We propose <b>Generative Neural Retargeting</b> (GNR), which uses a flow matching model to sample feasible trajectories. GNR outperforms MPC with only 8.5% of the samples required by MPC, achieving a success rate of 56.10% compared to 28.13% for MPC. GNR can be used for scalable and efficient retargeting of large-scale, long-horizon, and millimeter-precision human demonstrations: by applying GNR within a real-to-sim data engine, we produce a dexterous manipulation dataset with dense contact-force labels, spanning 223k demonstrations and 3.3k object geometries. Using GNR-generated data, we train visuomotor policies and demonstrate successful zero-shot sim-to-real transfer on a real robot.</p>
    </div>
   </div>
  </div>
</section>

<section id="method" class="sec">
  <div class="wrap">
    <div class="sec__head wrap--text">
      <p class="eyebrow">Method</p>
      <h2 class="sec__title">Learn and sample from the feasible motion manifold</h2>
      <p class="lead">Retargeting asks for a control sequence that reproduces a human demonstration under physics. IK is fast but ignores dynamics. Sampling-based MPC finds feasible motion but solves every demonstration from scratch, so its cost grows with dataset size and task difficulty. GNR learns a feasible motion manifold from a small MPC-generated seed dataset and samples robot trajectories from that manifold. Generalization and test-time scaling make GNR a more scalable and efficient retargeter.</p>
    </div>
    <figure class="pfig pfig--wide">
      <picture><source type="image/webp" srcset="assets/paper/fig1.webp?v=ceb200f6"><img src="assets/paper/fig1.png?v=43f58cea" width="1600" height="641" loading="lazy" decoding="async" data-gallery data-title="GNR at a glance" alt="Overview figure: the GNR data engine turns egocentric and motion-capture human recordings into robot trajectories by real-to-sim, inverse kinematics, and either MPC sampling or GNR sampling, yielding 223k trajectories over 3.3k geometries; the benchmarks span large-scale diverse objects and long-horizon high-precision tasks."></picture>
      <figcaption>GNR retargets large-scale, long-horizon and high-precision human demonstrations for five-fingered dexterous manipulation. A real-to-sim data engine reconstructs human motion from egocentric videos or from a wearable exoskeleton with motion capture, scaling up both diverse and difficult high-precision tasks.</figcaption>
    </figure>
    <div class="axes">
      <div class="axes__text">
        <h3>Two scaling axes</h3>
        <p><b>Diversity:</b> a dataset spanning many distinct geometries and motions, where the total sampling cost of MPC grows linearly with the number of demonstrations. <b>Difficulty:</b> long-horizon, millimeter-precision tasks, where errors compound and the samples needed to find a feasible trajectory grow rapidly.</p>
      </div>
      <div class="cost" aria-label="Illustrative sketches of MPC sampling cost">
        <figure class="cost__plot"><figcaption>Diversity</figcaption>
          <svg viewBox="0 0 230 134" role="img" aria-label="Diversity: sampling cost grows linearly with the number of demonstrations"><path class="axis" d="M30 10 L30 112 L220 112"/><path class="axis" d="M26.5 15 L30 9 L33.5 15 M215 108.5 L221 112 L215 115.5"/><path class="curve" d="M30.0 108.0 L204.0 32.0"/><text class="clabel" x="204.0" y="60.0" text-anchor="end">linear</text><text class="alabel" x="122" y="128" text-anchor="middle">number of demonstrations</text><text class="alabel" x="-64" y="18" transform="rotate(-90)" text-anchor="middle">sampling cost</text></svg>
        </figure>
        <figure class="cost__plot"><figcaption>Difficulty</figcaption>
          <svg viewBox="0 0 230 134" role="img" aria-label="Difficulty: sampling cost grows rapidly with longer horizons and tighter precision"><path class="axis" d="M30 10 L30 112 L220 112"/><path class="axis" d="M26.5 15 L30 9 L33.5 15 M215 108.5 L221 112 L215 115.5"/><path class="curve" d="M30.0 108.0 L34.4 107.7 L38.7 107.4 L43.0 107.1 L47.4 106.7 L51.8 106.3 L56.1 105.9 L60.5 105.4 L64.8 104.9 L69.2 104.4 L73.5 103.7 L77.8 103.1 L82.2 102.4 L86.6 101.6 L90.9 100.7 L95.2 99.8 L99.6 98.8 L104.0 97.7 L108.3 96.5 L112.6 95.2 L117.0 93.8 L121.4 92.2 L125.7 90.6 L130.1 88.7 L134.4 86.7 L138.8 84.6 L143.1 82.2 L147.4 79.7 L151.8 76.9 L156.1 73.8 L160.5 70.5 L164.8 66.9 L169.2 63.0 L173.5 58.7 L177.9 54.0 L182.2 49.0 L186.6 43.4 L191.0 37.4 L195.3 30.9 L199.7 23.8 L204.0 16.0"/><text class="clabel" x="192.0" y="22.0" text-anchor="end">rapid growth</text><text class="alabel" x="122" y="128" text-anchor="middle">horizon &amp; precision</text><text class="alabel" x="-64" y="18" transform="rotate(-90)" text-anchor="middle">sampling cost</text></svg>
        </figure>
        <p class="cost__note">Illustrative sketches, not measured data.</p>
      </div>
    </div>

    <h3 class="sub">How GNR works, step by step</h3>
    <div class="stepper" data-stepper>
      <ol class="stepper__list" role="tablist" aria-label="Method steps" aria-orientation="vertical">
        <li><button class="stepper__btn" role="tab" id="step-t1" aria-controls="step-p" aria-selected="true" data-step="0"><span class="stepper__n">1</span><span class="stepper__txt"><b>Seed data from a real-to-sim engine</b><span>Egocentric video or motion capture is reconstructed in simulation, retargeted by IK, and solved by DIAL-MPC. The solved demonstrations become training pairs.</span></span></button></li>
        <li><button class="stepper__btn" role="tab" id="step-t2" aria-controls="step-p" aria-selected="false" tabindex="-1" data-step="1"><span class="stepper__n">2</span><span class="stepper__txt"><b>IK gives a rough reference</b><span>For a new demonstration, keypoint IK and the object poses give the kinematic reference <i>x&#772;</i><sub>0:T</sub> and reference controls <i>u&#772;</i>, which ignore dynamics and contact.</span></span></button></li>
        <li><button class="stepper__btn" role="tab" id="step-t3" aria-controls="step-p" aria-selected="false" tabindex="-1" data-step="2"><span class="stepper__n">3</span><span class="stepper__txt"><b>A flow turns noise into a correction</b><span>A conditional flow-matching model maps Gaussian noise to a residual correction of the IK controls, conditioned on the reference and on object geometry (Point Transformer V3 over 1,024 points) or pose.</span></span></button></li>
        <li><button class="stepper__btn" role="tab" id="step-t4" aria-controls="step-p" aria-selected="false" tabindex="-1" data-step="3"><span class="stepper__n">4</span><span class="stepper__txt"><b>Sample many, check in simulation</b><span>Draw <i>S</i> candidates, replay each in simulation, and succeed if any passes the task criterion (pass@<i>S</i>). More samples raise success: test-time scaling.</span></span></button></li>
        <li><button class="stepper__btn" role="tab" id="step-t5" aria-controls="step-p" aria-selected="false" tabindex="-1" data-step="4"><span class="stepper__n">5</span><span class="stepper__txt"><b>Warm-start MPC on hard tasks</b><span>For long-horizon, high-precision tasks, a GNR sample gives MPC an on-manifold initialization, which MPC then refines in closed loop.</span></span></button></li>
      </ol>
      <div class="stepper__panel" id="step-p" role="tabpanel" aria-labelledby="step-t1">
        <div class="stepper__screen">
          <img class="stepper__poster" alt="" width="1280" height="720" loading="lazy" decoding="async">
          <video class="stepper__video" muted playsinline preload="none" aria-label="Method step excerpt from the explainer video"></video>
          <div class="stepper__prog"><i></i></div>
        </div>
        <p class="stepper__meta"><span>Excerpt from the explainer video.</span> <button type="button" class="linkbtn" data-act="step-film">Watch this part with sound</button></p>
      </div>
    </div>
    <div class="eq" role="math" aria-label="u from 0 to T minus 1 equals u bar plus delta hat, where delta hat equals G theta of z zero given c, z zero drawn from a standard normal, and c equals the reference x bar and object encoding o">
      <span><i>u</i><sub>0:T&minus;1</sub> = <i>u&#772;</i><sub>0:T&minus;1</sub> + <i class="hat">&Delta;</i></span>
      <span class="eq__sep">,</span>
      <span><i class="hat">&Delta;</i> = <i>G</i><sub><i>&theta;</i></sub>(<i>z</i><sub>0</sub>&thinsp;|&thinsp;<i>c</i>),&ensp;<i>z</i><sub>0</sub> ~ <i>N</i>(0,&thinsp;<b>I</b>),&ensp;<i>c</i> = (<i>x&#772;</i><sub>0:T</sub>,&thinsp;<i>o</i>)</span>
    </div>
    <p class="note">The backbone is a temporal U-Net with FiLM conditioning, sampled with a 10-step Euler ODE solver. Because GNR learns where feasible trajectories lie, it can also solve demonstrations on which its seed generator fails.</p>
    <figure class="pfig pfig--wide">
      <picture><source type="image/webp" srcset="assets/paper/fig2.webp?v=2d8c8c1c"><img src="assets/paper/fig2.png?v=59073b18" width="1600" height="796" loading="lazy" decoding="async" data-gallery data-title="The human-to-robot data engine" alt="The human-to-robot data engine: (a) real-to-sim and retargeting from motion-capture or egocentric recordings through preparation, real-to-sim plus IK, and physics refinement with DIAL-MPC to candidate trajectories with contact forces; (b) data expansion through a discovery phase and a scaling phase with rejection sampling, whose human-robot pairs train GNR to accelerate retargeting."></picture>
      <figcaption><b>The human-to-robot data engine.</b> (a) Motion-capture recordings (difficulty axis) and egocentric demonstrations (diversity axis) become candidate robot trajectories with simulation-derived contact-force labels. (b) Discovery identifies retargetable segments; scaling expands their physical and geometric coverage. Both filter candidates with the same success criterion, and the resulting pairs train GNR to accelerate subsequent retargeting.</figcaption>
    </figure>
  </div>
</section>

<section id="results" class="sec">
  <div class="wrap">
    <div class="sec__head wrap--text">
      <p class="eyebrow">Results</p>
      <h2 class="sec__title">Why GNR is better</h2>
      <p class="lead">Each block makes one claim and shows it the way the advantage appears: as video where GNR succeeds and the alternative fails, and as charts where the alternative also succeeds but costs far more. All retargeting results are in simulation: a physics simulator with a Tesollo DG-5F hand (on a Franka FR3 arm for ShapeFilter and Precision Assembly), except the multi-embodiment benchmark, which runs in MuJoCo Warp.</p>
    </div>


    <article class="claim" id="r-effective">
      <div class="claim__head">
        <p class="claim__n">01</p>
        <div><h3 class="claim__title">More success with 8.5% of the samples</h3>
